[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yubel"
version = "0.5.4"
description = "The cloud-native, multi-target DAST orchestrator: one config to run ZAP, Nuclei, Nikto, Wapiti, testssl.sh, sqlmap, dalfox, schemathesis, kube-hunter and more against web, APIs, cloud, containers and Kubernetes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Yubel contributors" }]
keywords = ["dast", "security", "appsec", "devsecops", "kubernetes", "api-security", "cloud-security", "scanner", "vulnerability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/ggeorgeazevedo/yubel"
Documentation = "https://github.com/ggeorgeazevedo/yubel#readme"
Issues = "https://github.com/ggeorgeazevedo/yubel/issues"

[project.scripts]
yubel = "yubel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yubel = ["data/*.yaml", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
