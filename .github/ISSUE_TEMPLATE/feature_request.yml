name: "✨ Feature request"
description: Suggest a capability — a report format, an attack-chain rule, a CLI/config option
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "When I ..., Yubel currently ... which means ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Attack-chain rule (analysis/chains.py)
        - Taxonomy / risk scoring
        - Baseline / diff
        - Reporter (html/md/json/sarif)
        - CLI / config
        - Deploy (Docker/Helm/CI)
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
