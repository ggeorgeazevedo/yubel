name: Release
on:
  push:
    # NB: exact semver tags only. The Marketplace-facing floating tag `v0` is
    # moved on every release, and a bare "v*" filter fired this workflow for it
    # too — cutting a stray "v0" GitHub Release and re-publishing an already
    # published version to PyPI.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write        # create the GitHub Release
  id-token: write        # PyPI Trusted Publishing (OIDC, no API token needed)

jobs:
  # A release tag that does not point at `main` publishes code nobody reviewed
  # on the branch. It happened: v0.8.0 was tagged on a feature-branch commit
  # that the squash-merge then discarded, so the tag names a commit reachable
  # from no branch — and the code it published was missing a fix that had
  # already landed. PyPI does not allow republishing a version, so that tag
  # could not be corrected, only superseded.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of main. Tag a commit that is on main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA} is on main"

      # On main is not the same as being the release commit. `v0.9.0` was
      # tagged one merge too early, on a tree that still declared 0.8.1: the
      # guard above passed, the build packaged 0.8.1, and PyPI refused it only
      # because that exact filename already existed. A published image had
      # already gone out tagged 0.9.0 with 0.8.1 inside. The tag has to name
      # the version the tree declares, and that is three seconds to check.
      - name: The tag must name the version this tree declares
        run: |
          declared="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME}" != "v${declared}" ]; then
            echo "::error::${GITHUB_REF_NAME} does not match the version in pyproject.toml (${declared}). Merge the release commit before tagging, or tag v${declared}."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} matches pyproject version ${declared}"

  build:
    needs: guard
    runs-on: ubuntu-latest
    # The workflow grants `contents: write` and `id-token: write` because the
    # two publishing jobs below need them. This job needs neither, and it is
    # the only one that executes third-party code (`build`, `twine`). Without
    # its own declaration it inherited both — enough to read
    # $ACTIONS_ID_TOKEN_REQUEST_TOKEN directly and mint a PyPI OIDC token,
    # which routes around the `environment: pypi` gate on the job that is
    # supposed to be the only one that can publish.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install "build==1.5.0"
          python -m build
      - name: Check metadata
        run: |
          pip install "twine==7.0.0"
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: dist, path: dist }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yubel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: dist, path: dist }
      - name: Publish to PyPI (Trusted Publishing)
        # Pinned by commit, not by `release/v1`. That is a *branch*: whatever is
        # pushed to it runs here, in the one job holding `id-token: write` and
        # the PyPI Trusted Publisher, and could publish an arbitrary wheel as
        # `yubel` without a single commit landing in this repository.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        # One-time setup on PyPI: add a Trusted Publisher for this repo
        # (Project → Publishing → GitHub). No API token/secret required.
