name: Release
on:
  push:
    # NB: exact semver tags only. The Marketplace-facing floating tag `v0` is
    # moved on every release, and a bare "v*" filter fired this workflow for it
    # too — cutting a stray "v0" GitHub Release and re-publishing an already
    # published version to PyPI.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write        # create the GitHub Release
  id-token: write        # PyPI Trusted Publishing (OIDC, no API token needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yubel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # One-time setup on PyPI: add a Trusted Publisher for this repo
        # (Project → Publishing → GitHub). No API token/secret required.
