name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        # informational: style drift across ruff versions must not fail CI;
        # the tests below are the real gate.
        run: ruff check src || true
      - name: Tests
        run: pytest -q
      - name: Selftest (no network)
        run: yubel selftest -o /tmp/selftest

  # Nothing ever rendered this chart. That is how `image.tag: latest` survived
  # four releases sitting next to an `appVersion` it contradicted: the Python
  # tests read the YAML, and reading YAML does not catch a template that fails
  # to render. `lint` checks the chart's shape; `template` is the one that
  # actually executes the Go templates and would have caught an unclosed `{{`,
  # a missing helper, or an `image.tag` that resolves to nothing.
  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.4
      - name: Lint
        run: helm lint deploy/helm/yubel
      - name: Render both modes
        run: |
          set -eux
          helm template yubel deploy/helm/yubel > /tmp/job.yaml
          helm template yubel deploy/helm/yubel --set mode=cronjob > /tmp/cronjob.yaml
          grep -q 'kind: Job' /tmp/job.yaml
          grep -q 'kind: CronJob' /tmp/cronjob.yaml
      # An empty `image.tag` must fall back to the chart's appVersion. Getting
      # this wrong renders `repository:` with nothing after the colon, which
      # Kubernetes reads as `:latest` — the exact default we just removed,
      # reintroduced by silence.
      - name: The image tag resolves to the chart's appVersion
        run: |
          set -eux
          want="$(grep '^appVersion:' deploy/helm/yubel/Chart.yaml | tr -d '"' | awk '{print $2}')"
          grep -q "image: \"ghcr.io/ggeorgeazevedo/yubel:${want}\"" /tmp/job.yaml
          helm template yubel deploy/helm/yubel --set image.tag=0.0.0-test \
            | grep -q 'image: "ghcr.io/ggeorgeazevedo/yubel:0.0.0-test"'
