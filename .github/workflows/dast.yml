name: Yubel scan
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"        # weekly, Monday 03:00 UTC
  # NB: intentionally not on pull_request — this job runs the published
  # ghcr.io image, which only exists after the first release. Run it manually
  # (Actions → Yubel scan → Run workflow) once the image is published.

permissions:
  contents: read
  security-events: write        # required to upload SARIF

env:
  REPORT_DIR: yubel-report

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The image runs as the non-root user `yubel` (uid 10001, see Dockerfile)
      # while the runner workspace is owned by uid 1001 with mode 755. Mounting
      # the whole workspace and asking yubel to create a subdirectory inside it
      # makes write_reports() -> os.makedirs() raise PermissionError, so *no*
      # report is written at all. Create the directory on the host, make it
      # writable, and mount that directory directly onto /out.
      - name: Prepare report directory
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/${REPORT_DIR}"
          chmod 777 "${GITHUB_WORKSPACE}/${REPORT_DIR}"

      - name: Run Yubel
        id: scan
        env:
          # via env, not inline ${{ }}, to avoid shell injection from repo vars
          DAST_TARGET: ${{ vars.DAST_TARGET || 'https://example.com' }}
        run: |
          set +e
          docker run --rm -v "${GITHUB_WORKSPACE}/${REPORT_DIR}:/out" \
            ghcr.io/ggeorgeazevedo/yubel:latest \
            scan -t "${DAST_TARGET}" --fail-on high -o /out
          code=$?
          set -e
          echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
          echo "--- contents of ${REPORT_DIR} ---"
          ls -la "${GITHUB_WORKSPACE}/${REPORT_DIR}" || true
          if [ "${code}" -eq 0 ]; then
            echo "Scan clean: nothing at or above the gate threshold."
          elif [ "${code}" -eq 2 ]; then
            echo "::warning title=Yubel gate::Findings at or above 'high'. Reports are still published."
          else
            echo "::error title=Yubel failed::yubel exited with ${code} (not a gate failure). See the log above."
            exit "${code}"
          fi

      # upload-sarif hard-fails on a missing path, which is what turned an
      # empty report directory into a red job. Only call it when the file
      # is actually there.
      - name: Check for SARIF
        id: sarif
        if: always()
        run: |
          if [ -s "${GITHUB_WORKSPACE}/${REPORT_DIR}/yubel.sarif" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No SARIF::${REPORT_DIR}/yubel.sarif was not produced - skipping the code scanning upload."
          fi

      - name: Upload SARIF to code scanning
        if: always() && steps.sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: yubel-report/yubel.sarif

      - name: Publish HTML/JSON reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: yubel-report
          path: yubel-report/
          if-no-files-found: warn
