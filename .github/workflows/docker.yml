name: Docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # NB: not on pull_request — the full image build (ZAP + Go tools) is heavy and
  # was failing noisily on Dependabot PRs. Build/push happens on main and tags.

permissions:
  contents: read
  packages: write        # push to ghcr.io (no extra secret needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # only log in when we intend to push (main branch or a tag)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (PRs)
        if: github.event_name == 'pull_request'
        run: docker build -t yubel:ci . && docker run --rm yubel:ci selftest -o /tmp/out
