name: Docker
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]   # exact semver only; not the floating v0
  pull_request:
    # Path-scoped rather than off entirely. The full build is heavy and used to
    # fail noisily on Dependabot PRs, so this workflow was excluded from PRs —
    # which also meant the image was pushed to ghcr.io with nothing ever having
    # verified it. It went out advertising thirteen engines with eleven in it.
    # Scoping to the files that can break the image keeps the noise away and
    # still proves every change that touches it.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push to ghcr.io (no extra secret needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU            # arm64 emulation for the multi-arch build
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        # only log in when we intend to push (main branch or a tag)
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Single-arch first, loaded into the local daemon, so the smoke test runs
      # against a real image. A multi-platform build cannot be `--load`ed, so
      # this has to come before the push build rather than instead of it; the
      # amd64 half of the push build is then a cache hit.
      - name: Build amd64 for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yubel:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image ships every engine it claims
        run: docker run --rm yubel:verify engines --check

      - name: Verify the pipeline runs end to end
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/smoke" && chmod 777 "${GITHUB_WORKSPACE}/smoke"
          docker run --rm -v "${GITHUB_WORKSPACE}/smoke:/out" yubel:verify \
            selftest -o /out
          test -s "${GITHUB_WORKSPACE}/smoke/yubel.sarif"

      # The gate above builds amd64 only, because a multi-platform build cannot
      # be `--load`ed into the daemon for the smoke test. That left a hole the
      # size of an architecture: `go install` refuses GOBIN while
      # cross-compiling, so the arm64 leg failed on every push to main while
      # every PR was green. Whatever only breaks under cross-compilation has to
      # be built where it can break, and that has to happen before the merge.
      - name: Build every published architecture (PRs)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build multi-arch and push (main/tags)
        if: github.event_name == 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
