# Yubel GitHub Action (composite).
#
# Runs a DAST scan in the published container and leaves the reports in
# `out` (default `yubel-report/`). SARIF upload to GitHub code scanning is
# opt-in via `upload-sarif: true` — see the README for the two-step form.
#
#   - uses: ggeorgeazevedo/yubel@v0
#     with:
#       target: https://staging.example.com
#       fail-on: high
#
# NB: this is a composite action rather than a `using: docker` one on purpose.
# The image runs as the non-root user `yubel` (uid 10001) and the runner
# workspace is owned by uid 1001 with mode 755, so a docker container action
# could not create its own output directory inside the mount — every report,
# SARIF included, was silently lost. Doing the `docker run` here lets us
# pre-create a writable output directory without dropping the image's
# non-root hardening. Linux runners only (same as before — it needs Docker).
name: "Yubel DAST Orchestrator"
description: "Run the Yubel multi-target DAST orchestrator in CI."
branding:
  icon: "shield"
  color: "red"

inputs:
  target:
    description: "Target URL (for a quick single-target scan)"
    required: false
  type:
    description: "Target type: web|api|graphql|cloud|kubernetes|container|host (grpc is in the enum but no engine covers it, and is rejected)"
    required: false
    default: "web"
  config:
    description: "Path to an yubel.yaml (overrides target/type)"
    required: false
  openapi:
    description: "OpenAPI/Swagger spec path or URL (api targets)"
    required: false
  engines:
    description: "Comma-separated allow-list of engines"
    required: false
  disable:
    description: "Comma-separated deny-list of engines"
    required: false
  fail-on:
    description: "Fail the job if a finding is at/above this severity"
    required: false
    default: "high"
  baseline:
    description: "Path to a prior yubel.json to diff against"
    required: false
  fail-on-new:
    description: "With `baseline`, gate only on new/regressed findings"
    required: false
    default: "false"
  fast:
    description: "Quick profile (smoke tests): tighter timeouts, fuzzing-only nuclei"
    required: false
    default: "false"
  offline:
    description: "Air-gapped hardening: passes --offline. Every engine either honours it with a verified switch or is skipped, with the reason in the report"
    required: false
    default: "false"
  out:
    description: "Output directory for reports (relative to the workspace)"
    required: false
    default: "yubel-report"
  # This default tracks the action's own version, and a test enforces that.
  # It used to be `:latest`, which made pinning the action pointless: someone
  # who pinned us to a commit SHA — as our own test now requires of every
  # action we consume — still received whatever image had been pushed last.
  # The lock was on the door and the window was open.
  #
  # A version tag rather than a digest, on purpose: the image for a version is
  # built from the git tag, which is created after this file is written, so the
  # digest cannot exist in the commit that would have to name it. The cost is a
  # window of minutes between merging a release PR and pushing its tag, during
  # which `main` names an image not yet published. Use a release ref rather
  # than `main` and the window is invisible.
  image:
    description: "Container image to run (defaults to the image built for this action's version)"
    required: false
    default: "ghcr.io/ggeorgeazevedo/yubel:0.9.0"
  upload-sarif:
    description: >-
      Upload yubel.sarif to GitHub code scanning. Requires the calling job to
      grant `permissions: security-events: write`. Leave false if you upload
      the SARIF yourself.
    required: false
    default: "false"

outputs:
  report-dir:
    description: "Absolute path to the directory holding the reports"
    value: ${{ steps.scan.outputs.report-dir }}
  sarif:
    description: "Path to yubel.sarif (empty when no SARIF was produced)"
    value: ${{ steps.sarif.outputs.path }}
  exit-code:
    description: "yubel exit code: 0 clean, 2 gate failed, other = error"
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Run Yubel
      id: scan
      shell: bash
      env:
        YUBEL_IMAGE: ${{ inputs.image }}
        IN_TARGET: ${{ inputs.target }}
        IN_TYPE: ${{ inputs.type }}
        IN_CONFIG: ${{ inputs.config }}
        IN_OPENAPI: ${{ inputs.openapi }}
        IN_ENGINES: ${{ inputs.engines }}
        IN_DISABLE: ${{ inputs.disable }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        IN_FAST: ${{ inputs.fast }}
        IN_OFFLINE: ${{ inputs.offline }}
        IN_OUT: ${{ inputs.out }}
      run: |
        set -uo pipefail

        if [ -z "${IN_CONFIG}" ] && [ -z "${IN_TARGET}" ]; then
          echo "::error title=Yubel::provide either 'target' or 'config'."
          exit 1
        fi

        case "${IN_OUT}" in
          /*) out_abs="${IN_OUT}" ;;
          *)  out_abs="${GITHUB_WORKSPACE}/${IN_OUT}" ;;
        esac

        # The container is non-root (uid 10001); it cannot mkdir inside a
        # workspace owned by uid 1001. Create the directory here and mount it
        # straight onto /out so the reporters always have somewhere to write.
        mkdir -p "${out_abs}" || exit 1
        chmod 777 "${out_abs}" || exit 1
        echo "report-dir=${out_abs}" >> "$GITHUB_OUTPUT"

        args=(scan)
        if [ -n "${IN_CONFIG}" ]; then
          args+=(-c "${IN_CONFIG}")
        else
          args+=(-t "${IN_TARGET}" --type "${IN_TYPE}")
        fi
        [ -n "${IN_OPENAPI}" ]  && args+=(--openapi "${IN_OPENAPI}")
        [ -n "${IN_FAIL_ON}" ]  && args+=(--fail-on "${IN_FAIL_ON}")
        [ -n "${IN_BASELINE}" ] && args+=(--baseline "${IN_BASELINE}")
        [ "${IN_FAIL_ON_NEW}" = "true" ] && args+=(--fail-on-new)
        [ "${IN_FAST}" = "true" ]        && args+=(--fast)
        [ "${IN_OFFLINE}" = "true" ]     && args+=(--offline)

        # comma-separated input -> repeated CLI flag
        add_list() {
          local flag="$1" raw="$2" item
          [ -n "${raw}" ] || return 0
          local IFS=','
          for item in ${raw}; do
            item="${item#"${item%%[![:space:]]*}"}"
            item="${item%"${item##*[![:space:]]}"}"
            [ -n "${item}" ] && args+=("${flag}" "${item}")
          done
        }
        add_list -e "${IN_ENGINES}"
        add_list -x "${IN_DISABLE}"

        args+=(-o /out)

        echo "::group::yubel ${args[*]}"
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/github/workspace:ro" \
          -v "${out_abs}:/out" \
          -w /github/workspace \
          "${YUBEL_IMAGE}" "${args[@]}"
        code=$?
        echo "::endgroup::"

        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        echo "--- ${out_abs} ---"
        ls -la "${out_abs}" || true

    # Report the SARIF before honouring the gate, so a failing gate still
    # publishes its findings instead of swallowing them.
    - name: Locate SARIF
      id: sarif
      if: always()
      shell: bash
      env:
        REPORT_DIR: ${{ steps.scan.outputs.report-dir }}
      run: |
        set -uo pipefail
        if [ -n "${REPORT_DIR:-}" ] && [ -s "${REPORT_DIR}/yubel.sarif" ]; then
          echo "path=${REPORT_DIR}/yubel.sarif" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=No SARIF::yubel.sarif was not produced - nothing to upload."
        fi

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && steps.sarif.outputs.found == 'true'
      # Pinned by commit like every workflow. This file is what the
      # Marketplace runs in a consumer's repository, so leaving its one
      # action on a mutable tag undid the pinning everywhere else.
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
      with:
        sarif_file: ${{ steps.sarif.outputs.path }}

    # Honour `fail-on` last: exit 2 is the severity gate, anything else
    # non-zero is a real failure of the scanner itself.
    - name: Apply gate
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        case "${CODE:-1}" in
          0) echo "Scan clean: nothing at or above the gate threshold." ;;
          2) echo "::error title=Yubel gate::Findings at or above '${IN_FAIL_ON}'."
             exit 2 ;;
          *) echo "::error title=Yubel failed::yubel exited with ${CODE:-1} (not a gate failure)."
             exit 1 ;;
        esac
