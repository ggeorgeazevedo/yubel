<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="How Yubel works"><defs><radialGradient id="bg" cx="28%" cy="20%" r="100%"><stop offset="0%" stop-color="#2a2050"/><stop offset="100%" stop-color="#120e24"/></radialGradient></defs><rect width="1200" height="680" fill="url(#bg)"/><text x="60" y="72" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="42" font-weight="700" fill="#f3efe6">How Yubel works</text><text x="62" y="104" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#b9b2cf">orchestrate best-of-breed OSS engines &#8594; correlate &#8594; decide</text><text x="1140" y="72" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="1" fill="#2fb2a4" text-anchor="end">web  ·  REST / GraphQL APIs  ·  cloud  ·  containers  ·  Kubernetes</text><rect x="60" y="150" width="210" height="360" rx="16" fill="#1c1533" stroke="#332a52" stroke-width="1.5"/><text x="82" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#2fb2a4">Run engines</text><text x="82" y="222" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#7d76a0">13 OSS scanners</text><circle cx="87" cy="253" r="4" fill="#2fb2a4"/><text x="102" y="258" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">ZAP · Nuclei · Nikto</text><text x="102" y="277" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">Wapiti · testssl.sh</text><circle cx="87" cy="299" r="4" fill="#2fb2a4"/><text x="102" y="304" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">dalfox · sqlmap</text><text x="102" y="323" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">XSS + injection</text><circle cx="87" cy="345" r="4" fill="#2fb2a4"/><text x="102" y="350" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">schemathesis</text><text x="102" y="369" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">API / OpenAPI fuzz</text><circle cx="87" cy="391" r="4" fill="#2fb2a4"/><text x="102" y="396" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">kube-hunter · +more</text><text x="102" y="415" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">cloud / Kubernetes</text><rect x="355" y="150" width="210" height="360" rx="16" fill="#1c1533" stroke="#332a52" stroke-width="1.5"/><text x="377" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f3efe6">Normalize</text><text x="377" y="222" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#7d76a0">one shared model</text><circle cx="382" cy="253" r="4" fill="#f3efe6"/><text x="397" y="258" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Dedupe</text><text x="397" y="277" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">merge duplicates</text><circle cx="382" cy="299" r="4" fill="#f3efe6"/><text x="397" y="304" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Severity scale</text><text x="397" y="323" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">5 levels, unified</text><circle cx="382" cy="345" r="4" fill="#f3efe6"/><text x="397" y="350" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Stable fingerprint</text><text x="397" y="369" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">track across runs</text><rect x="650" y="150" width="210" height="360" rx="16" fill="#1c1533" stroke="#8a72d8" stroke-width="3"/><rect x="650" y="150" width="210" height="34" rx="16" fill="#5b4aa6"/><rect x="650" y="168" width="210" height="16" fill="#5b4aa6"/><text x="755.0" y="173" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#f3efe6" text-anchor="middle">THE DIFFERENTIATOR</text><text x="672" y="216" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#8a72d8">Correlation brain</text><text x="672" y="242" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#7d76a0">what scanners can't do alone</text><circle cx="677" cy="273" r="4" fill="#8a72d8"/><text x="692" y="278" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Consensus</text><text x="692" y="297" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">seen by 2+ engines = corroborated</text><circle cx="677" cy="319" r="4" fill="#8a72d8"/><text x="692" y="324" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Attack chains</text><text x="692" y="343" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">SSRF+IMDS → takeover</text><circle cx="677" cy="365" r="4" fill="#8a72d8"/><text x="692" y="370" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Systemic correlation</text><text x="692" y="389" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">same flaw on N targets = 1 fix</text><circle cx="677" cy="411" r="4" fill="#8a72d8"/><text x="692" y="416" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Evidence trail</text><text x="692" y="435" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">deterministic “why”, auditable</text><rect x="945" y="150" width="210" height="360" rx="16" fill="#1c1533" stroke="#332a52" stroke-width="1.5"/><text x="967" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#d67a2f">Decide</text><text x="967" y="222" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#7d76a0">actionable output</text><circle cx="972" cy="253" r="4" fill="#d67a2f"/><text x="987" y="258" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Reports</text><text x="987" y="277" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">HTML · SARIF · MD · JSON</text><circle cx="972" cy="299" r="4" fill="#d67a2f"/><text x="987" y="304" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Risk + grade</text><text x="987" y="323" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">0–100 score · A–F</text><circle cx="972" cy="345" r="4" fill="#d67a2f"/><text x="987" y="350" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f3efe6">Taxonomy</text><text x="987" y="369" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b9b2cf">OWASP · CWE · MITRE</text><line x1="282" y1="330.0" x2="337" y2="330.0" stroke="#8a72d8" stroke-width="2.5"/><path d="M337 324.0 L345 330.0 L337 336.0 Z" fill="#8a72d8"/><line x1="577" y1="330.0" x2="632" y2="330.0" stroke="#8a72d8" stroke-width="2.5"/><path d="M632 324.0 L640 330.0 L632 336.0 Z" fill="#8a72d8"/><line x1="872" y1="330.0" x2="927" y2="330.0" stroke="#8a72d8" stroke-width="2.5"/><path d="M927 324.0 L935 330.0 L927 336.0 Z" fill="#8a72d8"/><rect x="240.0" y="550" width="720" height="52" rx="26" fill="#0d1a16" stroke="#2fb2a4" stroke-width="1.5"/><text x="600.0" y="583" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="0.5" fill="#2fb2a4" text-anchor="middle">No LLM &#183; No cloud &#183; zero outbound calls &#183; air-gapped ready</text><text x="600.0" y="658" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#7d76a0" text-anchor="middle">github.com/ggeorgeazevedo/yubel</text></svg>